infographic:`<div class="infographic"><h3>📊 Клиент-серверная архитектура</h3><div class="flow-chart"><span class="flow-step">🌐 Клиент</span><span class="flow-arrow">→</span><span class="flow-step">📨 HTTP запрос</span><span class="flow-arrow">→</span><span class="flow-step">⚙️ Django</span><span class="flow-arrow">→</span><span class="flow-step">📄 HTTP ответ</span><span class="flow-arrow">→</span><span class="flow-step">🌐 Клиент</span></div><div class="infographic-grid"><div class="info-card">📡 GET — параметры в URL</div><div class="info-card">📤 POST — тело запроса</div><div class="info-card">✅ 200 OK — успех</div><div class="info-card">🔴 404/500 — ошибка</div></div></div>`,
content:`<h2>Лекция 1: Введение в архитектуру веб-приложений. Место Django в экосистеме Python</h2>
<p><strong>Цель лекции:</strong> сформировать понимание клиент-серверной модели, HTTP-протокола, роли веб-фреймворков. Познакомить с философией Django и принципами организации рабочего окружения.</p>
<h3>1.1. Клиент-серверная архитектура как основа веба</h3>
<p>Любое веб-приложение строится вокруг взаимодействия двух сторон: клиента и сервера. Клиент (обычно браузер) инициирует обмен, отправляя запрос. Сервер обрабатывает запрос и возвращает ответ. Эта модель предполагает, что сервер не инициирует соединение самостоятельно, а только реагирует на входящие сообщения.</p>
<p>HTTP (HyperText Transfer Protocol) — основной протокол передачи данных в вебе. Каждый запрос содержит метод, который указывает на тип желаемого действия:</p>
<ul><li><strong>GET</strong> — запрос на получение данных. Параметры передаются в строке URL, что делает их видимыми и сохраняемыми в истории. GET не должен изменять состояние сервера.</li>
<li><strong>POST</strong> — отправка данных на сервер (например, заполненной формы). Данные передаются в теле запроса, не видны в URL. POST предназначен для операций, которые изменяют состояние (создание, обновление, удаление).</li></ul>
<p>Коды ответов HTTP информируют клиента о результате обработки запроса:</p>
<ul><li><strong>200 (OK)</strong> — запрос выполнен успешно.</li>
<li><strong>301/302 (Redirect)</strong> — запрошенный ресурс временно или постоянно находится по другому адресу.</li>
<li><strong>403 (Forbidden)</strong> — сервер понял запрос, но отказывается его выполнять из-за недостатка прав.</li>
<li><strong>404 (Not Found)</strong> — ресурс не найден.</li>
<li><strong>500 (Internal Server Error)</strong> — на сервере произошла необработанная ошибка. Django располагается на стороне сервера и отвечает за приём запросов, выполнение программной логики и формирование ответов.</li></ul>
<h3>1.2. Философия Django и его место среди фреймворков</h3>
<p>Django — это высокоуровневый веб-фреймворк на языке Python, следующий принципу <strong>"Batteries included"</strong> (с батарейками в комплекте). Это означает, что фреймворк предоставляет готовые решения для большинства типовых задач веб-разработки.</p>
<p>Из коробки Django включает:</p>
<ul><li>Объектно-реляционное отображение (ORM) для работы с базами данных без написания SQL-кода.</li>
<li>Административную панель, автоматически генерируемую на основе моделей данных.</li>
<li>Систему маршрутизации URL, связывающую адресные строки с функциями-обработчиками.</li>
<li>Встроенную систему шаблонов для отделения представления от логики.</li>
<li>Механизмы аутентификации и авторизации пользователей.</li>
<li>Защиту от распространённых веб-уязвимостей (CSRF, XSS, SQL-инъекции).</li></ul>
<p>Django часто сравнивают с микрофреймворками (Flask, FastAPI). Разница заключается в степени контроля и объёме предоставляемой функциональности. Микрофреймворки требуют самостоятельного подключения компонентов (базы данных, админки, форм), но дают больше гибкости. Django предлагает жёсткую, но продуктивную структуру, позволяющую быстро создавать сложные проекты.</p>
<h3>1.3. Интерпретатор Python и изоляция окружения</h3>
<p>Для работы с Django требуется интерпретатор Python версии 3.10 или выше. Однако простая установка всех библиотек в глобальное окружение системы приводит к конфликтам: разные проекты могут требовать разных версий одной и той же библиотеки.</p>
<p>Решение этой проблемы — <strong>виртуальное окружение (virtual environment)</strong>. Это изолированная директория, содержащая собственную копию интерпретатора Python и установленных пакетов. Виртуальное окружение активируется перед началом работы над проектом и деактивируется после её завершения. Благодаря этому зависимости проекта не пересекаются с зависимостями других проектов или операционной системы. Встроенный модуль <strong>venv</strong> предоставляет инструменты для создания и управления такими окружениями.</p>
<h3>1.4. Структура проекта Django</h3>
<p>Команда создания проекта формирует базовую структуру директорий и файлов. Главные из них:</p>
<ul><li><strong>manage.py</strong> — скрипт-утилита для выполнения административных команд (запуск сервера, создание миграций, работа с оболочкой).</li>
<li><strong>settings.py</strong> — центральный файл конфигурации проекта. Содержит настройки базы данных, список установленных приложений, пути к статическим и медиа-файлам, режим отладки (DEBUG) и список разрешённых хостов (ALLOWED_HOSTS).</li>
<li><strong>urls.py</strong> — корневой файл маршрутизации. Определяет, какое представление должно обрабатывать тот или иной URL.</li></ul>
<p>Встроенный сервер разработки, запускаемый через manage.py runserver, предназначен только для локального тестирования. Он не соответствует требованиям безопасности и производительности для эксплуатации в реальных условиях.</p>
<h3>1.5. Управление зависимостями</h3>
<p>Для воспроизводимости окружения принято фиксировать все установленные пакеты и их версии в специальном файле (обычно <strong>requirements.txt</strong>). Этот файл позволяет другому разработчику или серверу в точности восстановить то же окружение, в котором разрабатывался проект. Данная практика является обязательной для командной разработки и развёртывания приложений.</p>`,
conclusion:`<h3>📌 Выводы по лекции 1</h3><p>Django — мощный фреймворк с принципом "Batteries included", работающий по модели клиент-сервер. Ключевые элементы: HTTP-методы (GET/POST), коды ответов, виртуальные окружения для изоляции проектов. Базовая структура проекта (manage.py, settings.py, urls.py) — фундамент для дальнейшей работы.</p>`},

{id:"lec2", num:2, title:"Лекция 2: Организация кода в Django. Модель MVT",
infographic:`<div class="infographic"><h3>🏛️ Архитектура MVT</h3><div class="flow-chart"><span class="flow-step">📨 Запрос</span><span class="flow-arrow">→</span><span class="flow-step">🔀 URLconf</span><span class="flow-arrow">→</span><span class="flow-step">👁️ View</span><span class="flow-arrow">↕️</span><span class="flow-step">🗄️ Model</span><span class="flow-arrow">→</span><span class="flow-step">📄 Template</span><span class="flow-arrow">→</span><span class="flow-step">📨 Ответ</span></div><div class="infographic-grid"><div class="info-card">🗄️ Model — данные, БД</div><div class="info-card">👁️ View — логика</div><div class="info-card">📄 Template — HTML</div></div></div>`,
content:`<h2>Лекция 2: Организация кода в Django. Модель MVT</h2>
<p><strong>Цель лекции:</strong> изучить архитектурный паттерн Model-View-Template, принципы маршрутизации URL, механизмы шаблонизации и работу со статическими файлами.</p>
<h3>2.1. Проект и приложение: иерархия компонентов</h3>
<p>В Django введены два важных понятия: <strong>проект</strong> и <strong>приложение</strong>. Проект — это весь веб-сайт в целом. Он содержит глобальные настройки, корневые маршруты и объединяет несколько приложений. Проект не занимается конкретной бизнес-логикой, а скорее координирует работу приложений.</p>
<p>Приложение — это модуль, отвечающий за конкретную функциональность: блог, календарь событий, система комментариев, корзина интернет-магазина. Приложения проектируются так, чтобы быть <strong>переиспользуемыми</strong>. Хорошо написанное приложение можно скопировать в другой проект, и оно продолжит работать с минимальными изменениями. Такое разделение позволяет поддерживать порядок в кодовой базе, особенно когда над проектом работает несколько разработчиков. Каждое приложение лежит в своей папке и имеет стандартную структуру: models.py, views.py, admin.py, urls.py, папки templates и static.</p>
<h3>2.2. Архитектура MVT (Model-View-Template)</h3>
<p>Django реализует вариант паттерна MVC (Model-View-Controller), который здесь называется <strong>MVT</strong>:</p>
<ul><li><strong>Model (Модель)</strong> — описывает структуру данных, хранящихся в базе. Модель определяет поля таблицы, отношения между таблицами, методы для работы с данными и бизнес-правила на уровне базы данных.</li>
<li><strong>View (Представление, вид)</strong> — содержит бизнес-логику обработки запроса. Представление получает запрос от клиента, взаимодействует с моделями для получения или изменения данных, подготавливает контекст и передаёт его шаблону. Возвращает представление всегда HTTP-ответ.</li>
<li><strong>Template (Шаблон)</strong> — отвечает за представление данных. Шаблон — это HTML-файл со встроенными специальными тегами и переменными. Он преобразует данные из контекста в финальную HTML-страницу, которую увидит пользователь.</li></ul>
<p>В отличие от классического MVC, где контроллер управляет потоком данных, в Django роль контроллера выполняет сам фреймворк: он анализирует URL, вызывает нужное представление, а представление решает, какие модели задействовать и какой шаблон отрендерить.</p>
<h3>2.3. Маршрутизация URL. Диспетчер и конвертеры</h3>
<p><strong>Маршрутизация (URLconf)</strong> — это механизм, который связывает входящий HTTP-запрос с конкретной функцией-представлением. Django обрабатывает URL следующим образом: при запуске проекта фреймворк загружает корневой модуль urls.py, проходится по списку urlpatterns и для каждого пути проверяет, совпадает ли он с началом запрошенного URL. При первом совпадении обработка останавливается, и управление передаётся указанному представлению.</p>
<p>Важная особенность: маршруты организуются иерархически. Приложение может иметь собственный файл urls.py, который подключается к корневому с помощью функции <strong>include()</strong>. Это позволяет приложению самостоятельно управлять своими URL, не затрагивая глобальную маршрутизацию.</p>
<p><strong>Динамические маршруты</strong> позволяют извлекать переменные из самого URL. Например, вместо создания отдельных правил для /posts/1/, /posts/2/, /posts/3/ создаётся один маршрут <code>/posts/&lt;int:post_id&gt;/</code>. Конвертер <strong>int</strong> преобразует строку из URL в целое число и передаёт его в представление как параметр. Существуют и другие конвертеры: <strong>str, slug, uuid, path</strong>.</p>
<h3>2.4. Система шаблонов</h3>
<p>Шаблоны в Django служат для генерации HTML. Они не должны содержать сложную бизнес-логику, но допускают простые конструкции для вывода переменных и организации циклов/условий. Основные элементы языка шаблонов:</p>
<ul><li><strong>Переменные:</strong> <code>{{ variable }}</code>. Значение переменной подставляется в том месте, где она написана. Можно обращаться к атрибутам через точку: <code>{{ user.name }}</code>.</li>
<li><strong>Теги:</strong> <code>{% tag %}</code>. Теги управляют логикой шаблона: циклы (<code>{% for %}</code>), условные операторы (<code>{% if %}</code>), включение других шаблонов (<code>{% include %}</code>), загрузка статических файлов (<code>{% load static %}</code>).</li>
<li><strong>Фильтры:</strong> <code>{{ variable|filter }}</code>. Фильтры изменяют значение переменной перед выводом. Примеры: <code>lower</code> (перевод в нижний регистр), <code>truncatechars</code> (обрезка строки до заданного числа символов), <code>date</code> (форматирование даты).</li></ul>
<p>Django ищет шаблоны в специальных директориях, по умолчанию — в папке <strong>templates</strong> каждого зарегистрированного приложения. Это позволяет приложению инкапсулировать собственные шаблоны.</p>
<h3>2.5. Наследование шаблонов</h3>
<p>Практически каждый сайт имеет повторяющиеся элементы: заголовок, навигационное меню, подвал. Вместо того чтобы копировать одну и ту же разметку на каждую страницу, Django предлагает механизм <strong>наследования шаблонов</strong>. Базовый шаблон определяет "скелет" страницы и помечает изменяемые области с помощью тега <code>{% block %}</code>. Дочерний шаблон начинается с тега <code>{% extends %}</code> и затем переопределяет только нужные блоки, оставляя остальную часть базового шаблона без изменений. При рендеринге дочернего шаблона Django сначала загружает базовый, затем подставляет содержимое блоков. Этот подход следует принципу <strong>DRY (Don't Repeat Yourself)</strong> и существенно упрощает поддержку сайта.</p>
<h3>2.6. Статические файлы</h3>
<p>Статические файлы (CSS, JavaScript, шрифты, изображения, используемые в оформлении) не создаются динамически и не меняются в процессе работы сайта. Django требует, чтобы такие файлы хранились в директории <strong>static</strong> внутри приложения (или в общих папках, настроенных в проекте). Для подключения статического файла в шаблоне сначала нужно загрузить специальную библиотеку <code>{% load static %}</code>, затем использовать тег <code>{% static 'путь/к/файлу' %}</code>. Во время разработки при включенном режиме DEBUG Django сам отдаёт статические файлы. В продакшене это должен делать веб-сервер (Nginx, Apache) или CDN, так как Django не рассчитан на эффективную отдачу больших объёмов статики.</p>`,
conclusion:`<h3>📌 Выводы по лекции 2</h3><p>Разделение на проект и приложения обеспечивает модульность. MVT — ключевой паттерн Django. Маршрутизация гибкая, поддерживает динамические URL. Система шаблонов с наследованием реализует принцип DRY. Статические файлы требуют отдельной настройки.</p>`},

{id:"lec3", num:3, title:"Лекция 3: Базы данных и объектно-реляционное отображение (ORM)",
infographic:`<div class="infographic"><h3>🗄️ ORM: от Python к SQL</h3><div class="flow-chart"><span class="flow-step">🐍 class Model</span><span class="flow-arrow">→</span><span class="flow-step">📋 makemigrations</span><span class="flow-arrow">→</span><span class="flow-step">💾 migrate</span><span class="flow-arrow">→</span><span class="flow-step">🗄️ Таблица БД</span></div><div class="infographic-grid"><div class="info-card">📝 CRUD: create, filter, get, update, delete</div><div class="info-card">🔗 Связи: ForeignKey, ManyToMany</div></div></div>`,
content:`<h2>Лекция 3: Базы данных и объектно-реляционное отображение (ORM)</h2>
<p><strong>Цель лекции:</strong> изучить принципы описания моделей данных, миграции как способ контроля схемы БД, основные CRUD-операции через ORM и связи между таблицами.</p>
<h3>3.1. Модели как описание предметной области</h3>
<p>В реляционных базах данных данные организуются в виде таблиц. Таблица состоит из строк (записей) и столбцов (полей). Каждая строка — это один объект предметной области (например, один пост блога). Каждый столбец — это атрибут объекта (заголовок поста, его содержание, дата создания).</p>
<p>Django позволяет описывать таблицы не на SQL, а на Python с помощью классов, наследующихся от <strong>models.Model</strong>. Атрибут класса, являющийся экземпляром одного из полей (например, CharField, TextField, DateTimeField), становится столбцом таблицы. Связь между таблицами задаётся специальными полями: ForeignKey, ManyToManyField, OneToOneField.</p>
<p>Каждая модель автоматически получает первичный ключ — поле <strong>id</strong>, которое уникально идентифицирует каждую запись. Этот ключ создаётся неявно, если явно не указано другое поле в качестве первичного.</p>
<p>Модель — это не просто схема таблицы, но и место для бизнес-логики, связанной с данными. Например, метод <strong>__str__</strong> определяет, как объект будет отображаться в административной панели и в отладочных сообщениях. Внутренний класс <strong>Meta</strong> позволяет задать метаинформацию: сортировку по умолчанию (ordering), понятные имена во множественном и единственном числе (verbose_name, verbose_name_plural).</p>
<h3>3.2. Миграции: эволюция схемы базы данных</h3>
<p>Разработка приложения редко проходит без изменений в структуре данных. Добавляются новые поля, удаляются старые, изменяются типы. Django предлагает механизм <strong>миграций</strong> для управления этими изменениями. Миграция — это файл, содержащий описание того, как изменить схему базы данных (создать таблицу, добавить столбец, удалить индекс).</p>
<p>Миграции создаются из текущего состояния моделей командой <strong>makemigrations</strong>. При этом Django сравнивает текущее состояние моделей с последней применённой миграцией и генерирует только необходимые изменения. Сами миграции применяются к базе данных командой <strong>migrate</strong>. Эта команда выполняет по очереди все неприменённые миграции, фиксируя выполнение в специальной таблице django_migrations.</p>
<p>Процесс работы с миграциями всегда однонаправлен: изменения вносятся в модели → создаётся миграция → миграция применяется. Никогда не следует редактировать миграции вручную и удалять их без необходимости, особенно если они уже были применены к рабочей базе данных.</p>
<h3>3.3. Объектно-реляционное отображение (ORM)</h3>
<p>ORM — это слой, который преобразует строки базы данных в объекты Python и обратно. Вместо написания SQL-запросов разработчик взаимодействует с моделями через менеджер объектов (<strong>objects</strong>), доступный у каждого класса модели. Базовые операции (<strong>CRUD</strong>):</p>
<ul><li><strong>Create (создание)</strong> — новый объект создаётся либо конструктором с последующим вызовом save(), либо через метод create() менеджера, который объединяет оба действия.</li>
<li><strong>Read (чтение)</strong> — метод all() возвращает все записи таблицы в виде QuerySet (коллекции, похожей на список). Метод filter() отбирает записи по условию. Метод get() возвращает одну запись и выбрасывает исключение, если такой записи нет или их несколько.</li>
<li><strong>Update (обновление)</strong> — объект извлекается из базы, его поля изменяются в памяти, затем вызывается save(). Для массового обновления нескольких записей используется метод update() на QuerySet.</li>
<li><strong>Delete (удаление)</strong> — вызывается метод delete() у объекта или у QuerySet.</li></ul>
<p>Важно понимать, что QuerySet <strong>ленив (lazy)</strong>. Фактический запрос к базе данных происходит только в момент, когда QuerySet итерируется, преобразуется в список или вызывается его метод exists(), count().</p>
<h3>3.4. Связи между таблицами</h3>
<p>Реальные проекты редко ограничиваются одной таблицей. Типичные отношения между данными:</p>
<ul><li><strong>Один ко многим (ForeignKey)</strong> — один объект ссылается на другой. Пример: один пост может иметь много комментариев, но каждый комментарий принадлежит одному посту. Поле ForeignKey хранит на своей стороне идентификатор связанного объекта.</li>
<li><strong>Многие ко многим (ManyToManyField)</strong> — объекты связаны неограниченно с обеих сторон. Пример: книга и автор — один автор может написать много книг, и у одной книги может быть много авторов. Django создаёт промежуточную таблицу для хранения связей.</li>
<li><strong>Один к одному (OneToOneField)</strong> — расширение модели. Пример: профиль пользователя содержит дополнительные поля, не входящие в стандартную модель пользователя.</li></ul>
<p>Параметр <strong>on_delete</strong> для внешних ключей определяет, что должно произойти при удалении связанного объекта. Например, CASCADE удалит все зависимые объекты, PROTECT запретит удаление, если на объект есть ссылки.</p>`,
conclusion:`<h3>📌 Выводы по лекции 3</h3><p>Модели — Python-классы, отображаемые на таблицы БД. Миграции позволяют безопасно эволюционировать схему. ORM предоставляет CRUD-операции без SQL. Связи между таблицами задаются специальными полями.</p>`},

{id:"lec4", num:4, title:"Лекция 4: Автоматическая административная панель",
infographic:`<div class="infographic"><h3>⚙️ Django Admin</h3><div class="infographic-grid"><div class="info-card">👑 createsuperuser</div><div class="info-card">📋 list_display</div><div class="info-card">🔍 list_filter</div><div class="info-card">🔎 search_fields</div><div class="info-card">📝 prepopulated_fields</div><div class="info-card">⚡ actions</div></div></div>`,
content:`<h2>Лекция 4: Автоматическая административная панель. Инструмент для управления контентом</h2>
<p><strong>Цель лекции:</strong> рассмотреть возможности встроенной админ-панели Django, принципы её настройки и кастомизации, а также сценарии использования.</p>
<h3>4.1. Архитектура и назначение Django Admin</h3>
<p>Административная панель — одно из ключевых преимуществ Django. Это полноценный веб-интерфейс, автоматически генерируемый на основе зарегистрированных моделей. Панель доступна по пути <strong>/admin/</strong> и предназначена для авторизованных пользователей с правом staff (персонал) или superuser (суперадминистратор).</p>
<p>Из коробки админка предоставляет:</p>
<ul><li>Просмотр списка записей для каждой модели.</li>
<li>Добавление новых записей через форму, поля которой соответствуют полям модели.</li>
<li>Редактирование и удаление существующих записей.</li>
<li>Поиск и фильтрацию (после настройки).</li>
<li>Управление пользователями и группами с разграничением прав.</li></ul>
<p>Админка не генерируется магическим образом: она использует те же модели, формы и представления, которые доступны разработчику. Это означает, что её поведение можно переопределять почти на любом уровне.</p>
<h3>4.2. Регистрация моделей</h3>
<p>По умолчанию в админке отображаются только две встроенные модели: <strong>User</strong> (пользователи) и <strong>Group</strong> (группы). Все пользовательские модели необходимо зарегистрировать в файле <strong>admin.py</strong> приложения. Простейшая регистрация — вызов <code>admin.site.register(MyModel)</code>. После этого модель появляется в админке, и с ней можно работать через стандартные формы и списки.</p>
<p>Однако стандартные список и форма часто неудобны. Например, в списке записей отображается только результат метода __str__ модели, что недостаточно для быстрой навигации. Форма показывает все поля в том порядке, в котором они объявлены в модели, без группировки.</p>
<h3>4.3. Кастомизация отображения списка</h3>
<p>Для тонкой настройки создаётся класс, наследующий от <strong>ModelAdmin</strong>. В этом классе можно задать следующие атрибуты:</p>
<ul><li><strong>list_display</strong> — кортеж из имён полей, которые должны отображаться в списке в виде колонок. Можно выводить не только поля модели, но и методы модели или методы самого ModelAdmin.</li>
<li><strong>list_filter</strong> — поля, по которым справа будут появляться фильтры. Django автоматически создаёт подходящие интерфейсы: выпадающие списки для выбора из набора значений, иерархические фильтры для дат.</li>
<li><strong>search_fields</strong> — поля, по которым будет работать глобальная строка поиска. Поиск выполняется с помощью оператора LIKE (регистронезависимый полнотекстовый поиск не поддерживается из коробки).</li>
<li><strong>ordering</strong> — сортировка по умолчанию.</li>
<li><strong>list_per_page</strong> — количество записей на странице (пагинация).</li></ul>
<p>После того как класс ModelAdmin создан, он передаётся вторым параметром в admin.site.register() или используется в виде декоратора <strong>@admin.register()</strong>.</p>
<h3>4.4. Настройка формы редактирования</h3>
<p>Форму добавления и редактирования записи также можно настраивать:</p>
<ul><li><strong>fields</strong> — просто список полей в том порядке, в котором они должны выводиться.</li>
<li><strong>fieldsets</strong> — более продвинутая группировка. Позволяет разбить форму на несколько логических блоков, некоторые из которых можно сворачивать (параметр classes: ('collapse',)).</li>
<li><strong>prepopulated_fields</strong> — указывает, какие поля должны автоматически заполняться на основе других. Чаще всего используется для поля slug, которое генерируется из заголовка транслитерацией.</li></ul>
<h3>4.5. Действия над группой записей</h3>
<p>По умолчанию в админке есть действие "Удалить выбранные записи". Разработчик может добавить собственные <strong>действия (actions)</strong>. Действие — это функция, которая принимает запрос, QuerySet выбранных объектов и выполняет над ними массовую операцию (например, опубликовать, перенести в архив, присвоить категорию). Действие регистрируется в ModelAdmin через атрибут actions.</p>
<p>Важное ограничение: массовые действия по умолчанию не вызывают методы save() для каждого объекта, поэтому не срабатывают сигналы и не выполняются валидации, связанные с отдельными объектами. Это сделано ради производительности.</p>
<h3>4.6. Ограничение доступа и прав</h3>
<p>Админка уважает систему прав доступа Django. Если пользователь не имеет права на добавление, изменение или удаление объектов определённой модели, соответствующие кнопки и действия будут скрыты. Разработчик может переопределить методы has_view_permission, has_add_permission, has_change_permission, has_delete_permission в классе ModelAdmin для реализации нестандартной логики доступа (например, редактор может редактировать только свои посты).</p>`,
conclusion:`<h3>📌 Выводы по лекции 4</h3><p>Django Admin — мощный инструмент управления контентом. Кастомизация через ModelAdmin: list_display, list_filter, search_fields, fieldsets, prepopulated_fields. Действия (actions) позволяют выполнять массовые операции.</p>`},

{id:"lec5", num:5, title:"Лекция 5: Формы и приём данных от пользователя",
infographic:`<div class="infographic"><h3>📝 Жизненный цикл формы</h3><div class="flow-chart"><span class="flow-step">GET</span><span class="flow-arrow">→</span><span class="flow-step">Пустая форма</span><span class="flow-arrow">→</span><span class="flow-step">POST</span><span class="flow-arrow">→</span><span class="flow-step">is_valid()</span><span class="flow-arrow">→</span><span class="flow-step">cleaned_data</span><span class="flow-arrow">→</span><span class="flow-step">save/редирект</span></div><div class="infographic-grid"><div class="info-card">✅ Form — независимая</div><div class="info-card">📦 ModelForm — связана с моделью</div><div class="info-card">🛡️ csrf_token — обязательный тег</div></div></div>`,
content:`<h2>Лекция 5: Формы и приём данных от пользователя</h2>
<p><strong>Цель лекции:</strong> изучить механизм форм в Django — от генерации HTML до валидации и защиты от атак.</p>
<h3>5.1. Проблема обработки пользовательского ввода</h3>
<p>Работа с данными, полученными от пользователя, — одна из самых ответственных областей веб-разработки. Пользователь может отправить что угодно: отсутствующие значения, данные неверного типа, гигантские объёмы текста, вредоносный HTML/JavaScript (XSS-атака), SQL-код, специально сформированные данные для обхода логики. Ручная обработка каждого поля (проверка наличия, типа, диапазона, безопасность, приведение типов) приводит к огромному объёму дублирующегося кода. Django Forms решают эту проблему, автоматизируя: генерацию HTML-полей, первичную очистку и преобразование данных, валидацию на основе правил, повторное отображение формы с сообщениями об ошибках.</p>
<h3>5.2. Два типа форм: Form и ModelForm</h3>
<p>В Django существует два базовых класса для построения форм:</p>
<ul><li><strong>forms.Form</strong> — независимая форма, не привязанная к модели данных. Используется, когда данные не сохраняются напрямую в базу (например, форма поиска, форма обратной связи, форма подписки).</li>
<li><strong>forms.ModelForm</strong> — форма, автоматически создаваемая на основе модели. Django выводит поля из модели, учитывая их типы, валидаторы и ограничения. После валидации модель может быть сохранена одним вызовом save(). ModelForm значительно сокращает код, особенно для типовых CRUD-операций. Внутренний класс Meta указывает, на какой модели основана форма и какие поля из этой модели должны присутствовать (можно исключить поля с помощью exclude).</li></ul>
<h3>5.3. Жизненный цикл обработки формы</h3>
<p>Типичная обработка формы в представлении включает следующие этапы:</p>
<ol><li>Определить тип запроса: GET (показать пустую форму) или POST (обработать данные).</li>
<li>Для POST-запроса создать экземпляр формы, передав в него request.POST (и, возможно, request.FILES для файлов).</li>
<li>Вызвать метод <strong>is_valid()</strong>. Он запускает валидацию всех полей. Если валидация пройдена, данные становятся доступны в form.cleaned_data.</li>
<li>При успешной валидации выполнить действие (сохранить модель, отправить письмо, обновить сессию) и выполнить редирект (паттерн Post/Redirect/Get, предотвращающий повторную отправку формы при обновлении страницы).</li>
<li>Если форма невалидна, вернуть ответ с той же формой, но уже с заполненными данными и ошибками. Шаблон должен вывести эти ошибки рядом с полями.</li></ol>
<p>Важное замечание: метод is_valid() не только возвращает булево значение, но и наполняет форму ошибками и очищенными данными.</p>
<h3>5.4. Валидация: уровни и механизмы</h3>
<p>Валидация в Django Forms проходит несколько уровней:</p>
<ol><li><strong>Валидация поля</strong> — для каждого типа поля есть свой набор встроенных валидаторов. Например, CharField проверяет, что значение не превышает max_length; EmailField — что переданная строка похожа на email.</li>
<li><strong>Метод clean_&lt;fieldname&gt;</strong> — если нужна дополнительная валидация конкретного поля с доступом к уже очищенному значению. Этот метод должен вернуть очищенное значение или выбросить ValidationError.</li>
<li><strong>Метод clean формы</strong> — вызывается после всех полей. Используется для валидации, требующей одновременного доступа к нескольким полям (например, проверка, что пароль и подтверждение пароля совпадают).</li>
<li>В случае ModelForm — валидация на уровне модели и её полей также запускается при вызове is_valid().</li></ol>
<p>Все ошибки накапливаются и могут быть выведены в шаблоне как общие (form.non_field_errors) или привязанные к конкретному полю (form.field_name.errors).</p>
<h3>5.5. Защита от подделки межсайтовых запросов (CSRF)</h3>
<p>Атака CSRF заключается в том, что злоумышленник заставляет браузер жертвы отправить запрос на сайт, где жертва уже аутентифицирована (например, перейти по специально созданной ссылке). Чтобы предотвратить это, Django требует наличия в каждом POST-запросе уникального токена, который привязан к сессии пользователя. В шаблоне для формы этот токен вставляется тегом <strong>{% csrf_token %}</strong>. Django автоматически проверяет наличие и корректность токена в каждом входящем POST-запросе (кроме специально помеченных декоратором @csrf_exempt). Если токен отсутствует или неверен, запрос отклоняется с кодом 403. CSRF-защита — встроенный механизм, не требующий дополнительных действий со стороны разработчика, кроме добавления {% csrf_token %} в каждую HTML-форму.</p>
<h3>5.6. Отображение формы в шаблоне</h3>
<p>Django предоставляет несколько способов вывести форму в шаблоне:</p>
<ul><li><code>{{ form.as_p }}</code> — каждое поле в отдельном абзаце (&lt;p&gt;).</li>
<li><code>{{ form.as_table }}</code> — каждое поле в строке таблицы (&lt;tr&gt;).</li>
<li><code>{{ form.as_ul }}</code> — каждое поле в элементе списка (&lt;li&gt;).</li>
<li>Ручной перебор полей через <code>{% for field in form %}</code> — для тонкого контроля разметки.</li>
<li>Обращение к конкретному полю: <code>{{ form.field_name }}</code>.</li></ul>
<p>Рядом с полем можно вывести его ошибки (<code>{{ field.errors }}</code>), метку (<code>{{ field.label }}</code>), описание (<code>{{ field.help_text }}</code>).</p>`,
conclusion:`<h3>📌 Выводы по лекции 5</h3><p>Формы Django автоматизируют работу с пользовательским вводом. ModelForm связана с моделью. Жизненный цикл: GET/POST/is_valid. Многоуровневая валидация. CSRF-защита обязательна.</p>`},

{id:"lec6", num:6, title:"Лекция 6: Работа с медиа-файлами. Изображения и документы",
infographic:`<div class="infographic"><h3>🖼️ Медиа-файлы</h3><div class="infographic-grid"><div class="info-card">📁 MEDIA_ROOT — путь на диске</div><div class="info-card">🌐 MEDIA_URL — /media/</div><div class="info-card">📷 ImageField — требует Pillow</div></div></div>`,
content:`<h2>Лекция 6: Работа с медиа-файлами. Изображения и документы</h2>
<p><strong>Цель лекции:</strong> изучить механизмы приёма загружаемых файлов, их хранения, отдачи и оптимизации.</p>
<h3>6.1. Отличие статических от медиа-файлов</h3>
<p>В контексте Django важно различать:</p>
<ul><li><strong>Статические файлы</strong> являются частью самого приложения: CSS-стили, клиентские JavaScript-скрипты, шрифты, изображения интерфейса. Они не меняются пользователями и одинаковы для всех экземпляров приложения. Статика управляется через django.contrib.staticfiles.</li>
<li><strong>Медиа-файлы</strong> создаются и загружаются пользователями: аватары, фотографии товаров, прикрепляемые документы, видео. Медиа уникальны для каждого пользователя и для каждой записи. Они требуют другого подхода к хранению и правам доступа.</li></ul>
<p>Django разделяет эти два потока и требует разных настроек: STATIC_URL / STATIC_ROOT для статики и MEDIA_URL / MEDIA_ROOT для медиа.</p>
<h3>6.2. Настройка хранения медиа-файлов</h3>
<p>Для работы с медиа необходимо определить две переменные в settings.py:</p>
<ul><li><strong>MEDIA_URL</strong> — префикс URL, по которому медиа-файлы будут доступны. Например, /media/.</li>
<li><strong>MEDIA_ROOT</strong> — абсолютный путь к директории на диске, где эти файлы будут храниться. Рекомендуется использовать BASE_DIR / 'media'.</li></ul>
<p>В режиме разработки (DEBUG=True) Django может отдавать медиа-файлы через встроенный сервер. Для этого в корневой urls.py добавляется специальная строчка, которая работает только при отладке. В продакшене медиа-файлы должен отдавать веб-сервер (Nginx, Apache) или внешнее облачное хранилище (Amazon S3, Yandex Cloud), так как Django не спроектирован для эффективной раздачи больших потоков данных.</p>
<h3>6.3. Модели с файловыми полями</h3>
<p>Django предоставляет два основных типа полей для хранения файлов:</p>
<ul><li><strong>FileField</strong> — для хранения любых файлов (документы, архивы, исполняемые файлы).</li>
<li><strong>ImageField</strong> — специализированный подтип FileField, который дополнительно проверяет, что загруженный файл является изображением (благодаря библиотеке Pillow) и предоставляет атрибуты для работы с размерами и геометрией.</li></ul>
<p>Поле <strong>upload_to</strong> определяет подпапку внутри MEDIA_ROOT, куда будет сохранён файл. Он может быть простой строкой или функцией, которая возвращает путь в зависимости от объекта и оригинального имени файла. Это полезно для организации иерархии: например, upload_to='posts/%Y/%m/%d' сохранит файл в папку вида posts/2025/03/15.</p>
<p>Оригинальное имя файла, отправленное браузером, не сохраняется — Django генерирует новое имя, чтобы избежать конфликтов. При необходимости можно кастомизировать генерацию имени, переопределив поведение файловой системы хранения.</p>
<h3>6.4. Обработка загруженных файлов в формах</h3>
<p>Чтобы форма принимала файлы, HTML-тег &lt;form&gt; должен иметь атрибут <strong>enctype="multipart/form-data"</strong>. В представлении файлы передаются не через request.POST, а через <strong>request.FILES</strong>.</p>
<p>При использовании ModelForm с полем ImageField или FileField достаточно включить это поле в список fields. Django сам обработает загрузку: прочитает файл из request.FILES, сохранит его в MEDIA_ROOT по пути, сгенерированному upload_to, и запишет относительный путь в базу данных.</p>
<p>Важно: если в форме есть файловое поле, при инициализации формы из POST-запроса нужно передать два аргумента: request.POST и request.FILES. Иначе файлы не будут обработаны.</p>
<h3>6.5. Ограничение размера, типа и безопасности</h3>
<p>Django не ограничивает размер загружаемого файла по умолчанию — это делает веб-сервер. Однако можно добавить ограничение в валидации формы. Для проверки типа файла недостаточно полагаться на расширение в имени файла (его легко подделать). Более надёжно — проверять Content-Type из request.FILES или использовать специальные библиотеки, анализирующие сигнатуру файла (магические числа).</p>
<p>Дополнительные соображения безопасности:</p>
<ul><li>Загруженные файлы не должны выполняться на сервере как скрипты (PHP, Python, CGI).</li>
<li>Файлы не должны сохраняться с исходными именами, чтобы злоумышленник не мог угадать путь к файлу другого пользователя.</li>
<li>Рекомендуется хранить файлы за пределами директории, доступной для прямой загрузки, и отдавать их через отдельное представление с проверкой прав.</li></ul>
<h3>6.6. Создание миниатюр и оптимизация изображений</h3>
<p>Стандартный ImageField не создаёт миниатюры автоматически. Однако существует популярная библиотека <strong>sorl-thumbnail</strong>, которая генерирует уменьшенные копии изображений при первом запросе и кеширует их. Миниатюры ускоряют загрузку страниц (особенно на мобильных устройствах), экономят трафик и место на диске.</p>
<p>Альтернативный подход — использовать django-resized или выполнять ресайз изображений непосредственно в модели, переопределив метод save(). Это гарантирует, что даже исходное изображение не будет слишком большим, но требует больше кода.</p>`,
conclusion:`<h3>📌 Выводы по лекции 6</h3><p>Медиа-файлы требуют отдельных настроек. ImageField требует Pillow. upload_to организует хранение. Формы с файлами требуют enctype и request.FILES. Миниатюры создаются через sorl-thumbnail или ресайз в модели.</p>`},

{id:"lec7", num:7, title:"Лекция 7: Отладка, оптимизация и деплой Django-приложений",
infographic:`<div class="infographic"><h3>🚀 Путь в продакшен</h3><div class="infographic-grid"><div class="info-card">🐛 DEBUG=False</div><div class="info-card">🌍 ALLOWED_HOSTS</div><div class="info-card">🔐 .env + SECRET_KEY</div><div class="info-card">📦 collectstatic</div></div><div class="flow-chart"><span class="flow-step">Gunicorn</span><span class="flow-arrow">+</span><span class="flow-step">Nginx</span><span class="flow-arrow">+</span><span class="flow-step">PostgreSQL</span></div></div>`,
content:`<h2>Лекция 7: Отладка, оптимизация и деплой Django-приложений</h2>
<p><strong>Цель лекции:</strong> рассмотреть методы поиска ошибок и узких мест в производительности, а также этапы перехода от разработки к продакшену.</p>
<h3>7.1. Уровни логирования и вывод отладочной информации</h3>
<p>В процессе разработки часто требуется отслеживать ход выполнения программы, значения переменных, возникающие ошибки. Простой вывод через print() имеет ограничения: в продакшене такие сообщения никуда не записываются, могут попасть в ответ клиенту и нарушить формат данных. Более правильный подход — использовать модуль <strong>logging</strong> из стандартной библиотеки Python.</p>
<p>Логирование строится на четырёх компонентах:</p>
<ul><li><strong>Логгер</strong> — точка входа, у которой вызываются методы debug(), info(), warning(), error(), critical().</li>
<li><strong>Обработчик (handler)</strong> — определяет, куда отправляются записи (консоль, файл, системный журнал, удалённый сервер).</li>
<li><strong>Форматтер (formatter)</strong> — задаёт структуру записи: дата, уровень, имя логгера, сообщение.</li>
<li><strong>Фильтр (filter)</strong> — позволяет отбирать, какие записи обрабатывать.</li></ul>
<p>Django предварительно настраивает базовое логирование для запросов и ошибок. Разработчик может расширить эту конфигурацию через словарь LOGGING в settings.py. Рекомендуется создать отдельные логгеры для своих модулей, чтобы управлять уровнем детализации независимо.</p>
<h3>7.2. Отладка запросов и анализ производительности</h3>
<p>Одна из частых проблем в веб-приложениях — медленная работа из-за избыточного количества запросов к базе данных. <strong>Django Debug Toolbar</strong> — это подключаемая панель, которая отображает:</p>
<ul><li>Все выполненные SQL-запросы, их текст и время выполнения (с подсветкой дублирующихся и медленных).</li>
<li>Содержимое кеша, если он используется.</li>
<li>Время обработки запроса, разделённое на этапы (запрос БД, рендеринг шаблонов, прочее).</li>
<li>Заголовки запроса и ответа.</li>
<li>Используемые настройки.</li></ul>
<p>Панель работает только в режиме разработки (DEBUG=True). Она не должна быть включена в продакшене, так как раскрывает детали внутреннего устройства приложения и замедляет работу.</p>
<h3>7.3. Проблема N+1 запроса и способы её решения</h3>
<p>Типичная анти-паттерна в работе с ORM — ситуация, когда сначала запрашивается список объектов (один запрос), а затем в цикле для каждого объекта выполняется ещё один запрос для получения связанных данных. Итоговое количество запросов равно <strong>1 + N</strong>, где N — количество объектов в списке. При 100 постах это может дать 101 запрос — катастрофически медленно.</p>
<p>Django предлагает два метода для решения этой проблемы:</p>
<ul><li><strong>select_related()</strong> — выполняет SQL-соединение (JOIN) и выбирает данные из связанной таблицы одним запросом. Работает для отношений "один к одному" и "один ко многим" (когда нужны данные только с одной внешней таблицы).</li>
<li><strong>prefetch_related()</strong> — выполняет отдельные запросы для каждой связанной таблицы, а затем объединяет результаты на уровне Python. Работает для отношений "многие ко многим" и обратных связей.</li></ul>
<p>Использование этих методов не всегда очевидно, но анализ панели инструментов или включение логирования всех запросов позволяет быстро выявить N+1 проблему.</p>
<h3>7.4. Настройки перед выкаткой в продакшен</h3>
<p>Переход от разработки к эксплуатации требует изменения ряда настроек:</p>
<ul><li><strong>DEBUG = False</strong> — выключает подробные страницы ошибок, раскрывающие исходный код и настройки. Вместо этого Django показывает стандартные страницы 404, 500.</li>
<li><strong>ALLOWED_HOSTS</strong> — список доменных имён, на которых приложение должно отвечать. Обязательная настройка при выключенном DEBUG; иначе Django отклонит любой запрос.</li>
<li><strong>SECRET_KEY</strong> — секретный ключ, используемый для криптографических подписей. В разработке он часто захардкожен в коде, в продакшене должен быть вынесен в переменные окружения (не попадать в репозиторий).</li>
<li>Настройка статики: команда <strong>collectstatic</strong> собирает все статические файлы из всех приложений в единую директорию, указанную в STATIC_ROOT. Эту директорию должен обслуживать веб-сервер.</li>
<li>Настройка медиа: как уже обсуждалось, медиа-файлы не отдаются Django в продакшене.</li></ul>
<h3>7.5. Подходы к развёртыванию (без глубокой детализации)</h3>
<p>Развёртывание (деплой) — это процесс переноса приложения на сервер, где оно будет доступно публично. Минимальный стек для Django в продакшене включает:</p>
<ul><li><strong>WSGI-сервер</strong> (например, Gunicorn или uWSGI) — принимает запросы от веб-сервера, запускает Django-приложение и возвращает ответ.</li>
<li><strong>HTTP-сервер</strong> (Nginx или Apache) — стоит перед WSGI-сервером. Отдаёт статические и медиа-файлы, проксирует динамические запросы к WSGI-серверу, обрабатывает кеширование, SSL-сертификаты.</li>
<li><strong>База данных</strong> — для проектов с небольшой нагрузкой может оставаться SQLite, но для серьёзных проектов переходят на PostgreSQL или MySQL (требуют отдельной установки настройки).</li></ul>
<p>Процесс деплоя вручную сложен и подвержен ошибкам. В реальной работе используются инструменты автоматизации: Docker, Ansible, CI/CD-конвейеры (GitHub Actions, GitLab CI), специализированные PaaS-платформы (Heroku, PythonAnywhere, Yandex Cloud).</p>`,
conclusion:`<h3>📌 Выводы по лекции 7</h3><p>Логирование вместо print. Debug Toolbar для поиска узких мест. N+1 решается через select_related/prefetch_related. Деплой: DEBUG=False, ALLOWED_HOSTS, .env, collectstatic, Gunicorn + Nginx + PostgreSQL.</p>`},

{id:"lec8", num:8, title:"Лекция 8: API, WebSockets и асинхронность в Django",
infographic:`<div class="infographic"><h3>⚡ Современный Django-стек</h3><div class="flow-chart"><span class="flow-step">📡 DRF</span><span class="flow-arrow">+</span><span class="flow-step">🔌 Channels</span><span class="flow-arrow">+</span><span class="flow-step">🔄 Celery</span><span class="flow-arrow">+</span><span class="flow-step">🐳 Docker</span></div><div class="infographic-grid"><div class="info-card">REST API</div><div class="info-card">WebSockets</div><div class="info-card">Async views</div><div class="info-card">Фоновые задачи</div></div></div>`,
content:`<h2>Лекция 8: API, WebSockets и асинхронность в Django</h2>
<p><strong>Цель лекции:</strong> познакомить с современными инструментами Django: REST API, WebSockets, асинхронными представлениями и фоновыми задачами.</p>
<h3>8.1. Django REST Framework (DRF) — создание API</h3>
<p>Django REST Framework — это мощный инструмент для создания RESTful API на базе Django. Он предоставляет:</p>
<ul><li>Сериализаторы для преобразования моделей в JSON и обратно.</li>
<li>ViewSets и ModelViewSet — готовые представления для CRUD-операций.</li>
<li>Аутентификацию и разрешения (JWT, OAuth, токены).</li>
<li>Пагинацию, фильтрацию, сортировку.</li>
<li>Браузерную версию API для тестирования.</li></ul>
<p><strong>Пример сериализатора:</strong></p>
<div class="code-block"><span class="keyword">from</span> rest_framework <span class="keyword">import</span> serializers<br><span class="keyword">from</span> .models <span class="keyword">import</span> Post<br><br><span class="keyword">class</span> <span class="function">PostSerializer</span>(serializers.ModelSerializer):<br>&nbsp;&nbsp;&nbsp;&nbsp;<span class="keyword">class</span> <span class="function">Meta</span>:<br>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;model = Post<br>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;fields = [<span class="string">'id'</span>, <span class="string">'title'</span>, <span class="string">'slug'</span>, <span class="string">'content'</span>, <span class="string">'published_date'</span>]</div>
<p><strong>Пример ViewSet:</strong></p>
<div class="code-block"><span class="keyword">from</span> rest_framework <span class="keyword">import</span> viewsets<br><span class="keyword">from</span> .models <span class="keyword">import</span> Post<br><span class="keyword">from</span> .serializers <span class="keyword">import</span> PostSerializer<br><br><span class="keyword">class</span> <span class="function">PostViewSet</span>(viewsets.ModelViewSet):<br>&nbsp;&nbsp;&nbsp;&nbsp;queryset = Post.objects.all()<br>&nbsp;&nbsp;&nbsp;&nbsp;serializer_class = PostSerializer</div>
<p>Маршруты создаются автоматически через <code>router.register()</code>.</p>
<h3>8.2. WebSockets и Django Channels</h3>
<p>Обычные HTTP-запросы работают по схеме "запрос-ответ". Для real-time функциональности (чаты, уведомления, live-обновления) нужны <strong>WebSockets</strong>. Django Channels добавляет поддержку WebSockets, позволяя писать асинхронные потребители (consumers).</p>
<p><strong>Пример WebSocket consumer:</strong></p>
<div class="code-block"><span class="keyword">from</span> channels.generic.websocket <span class="keyword">import</span> AsyncWebsocketConsumer<br><span class="keyword">import</span> json<br><br><span class="keyword">class</span> <span class="function">ChatConsumer</span>(AsyncWebsocketConsumer):<br>&nbsp;&nbsp;&nbsp;&nbsp;<span class="keyword">async</span> <span class="keyword">def</span> <span class="function">connect</span>(self):<br>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;self.room_name = self.scope[<span class="string">'url_route'</span>][<span class="string">'kwargs'</span>][<span class="string">'room_name'</span>]<br>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;self.room_group_name = f<span class="string">'chat_{self.room_name}'</span><br>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<span class="keyword">await</span> self.channel_layer.group_add(self.room_group_name, self.channel_name)<br>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<span class="keyword">await</span> self.accept()<br><br>&nbsp;&nbsp;&nbsp;&nbsp;<span class="keyword">async</span> <span class="keyword">def</span> <span class="function">receive</span>(self, text_data):<br>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;data = json.loads(text_data)<br>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<span class="keyword">await</span> self.channel_layer.group_send(<br>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;self.room_group_name,<br>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;{<span class="string">'type'</span>: <span class="string">'chat_message'</span>, <span class="string">'message'</span>: data[<span class="string">'message'</span>]}<br>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;)<br><br>&nbsp;&nbsp;&nbsp;&nbsp;<span class="keyword">async</span> <span class="keyword">def</span> <span class="function">chat_message</span>(self, event):<br>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<span class="keyword">await</span> self.send(text_data=json.dumps({<span class="string">'message'</span>: event[<span class="string">'message'</span>]}))</div>
<h3>8.3. Асинхронные представления (Async views)</h3>
<p>Начиная с Django 3.1, поддерживаются асинхронные представления. Они позволяют выполнять неблокирующие операции (например, запросы к внешним API, работу с WebSockets, длительные вычисления).</p>
<p><strong>Пример асинхронного представления:</strong></p>
<div class="code-block"><span class="keyword">import</span> httpx<br><span class="keyword">from</span> django.http <span class="keyword">import</span> JsonResponse<br><br><span class="keyword">async</span> <span class="keyword">def</span> <span class="function">get_github_user</span>(request, username):<br>&nbsp;&nbsp;&nbsp;&nbsp;<span class="keyword">async</span> <span class="keyword">with</span> httpx.AsyncClient() <span class="keyword">as</span> client:<br>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;response = <span class="keyword">await</span> client.get(f<span class="string">'https://api.github.com/users/{username}'</span>)<br>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<span class="keyword">return</span> JsonResponse(response.json())</div>
<h3>8.4. Фоновые задачи с Celery и Redis</h3>
<p>Для выполнения длительных операций (отправка писем, обработка изображений, генерация отчётов) без блокировки пользовательского интерфейса используются фоновые задачи. <strong>Celery</strong> — распределённая очередь задач, которая работает с брокерами (Redis, RabbitMQ).</p>
<p><strong>Пример задачи Celery:</strong></p>
<div class="code-block"><span class="keyword">from</span> celery <span class="keyword">import</span> shared_task<br><span class="keyword">from</span> django.core.mail <span class="keyword">import</span> send_mail<br><br>@shared_task<br><span class="keyword">def</span> <span class="function">send_welcome_email</span>(user_email):<br>&nbsp;&nbsp;&nbsp;&nbsp;send_mail(<br>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<span class="string">'Добро пожаловать!'</span>,<br>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<span class="string">'Спасибо за регистрацию.'</span>,<br>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<span class="string">'noreply@example.com'</span>,<br>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;[user_email],<br>&nbsp;&nbsp;&nbsp;&nbsp;)<br>&nbsp;&nbsp;&nbsp;&nbsp;<span class="keyword">return</span> f<span class="string">"Email sent to {user_email}"</span></div>
<p>Задача вызывается асинхронно: <code>send_welcome_email.delay(user.email)</code>.</p>
<h3>8.5. Современный стек Django-разработчика</h3>
<p>Профессиональный Django-разработчик сегодня использует:</p>
<ul><li><strong>Django + DRF</strong> — для API.</li>
<li><strong>Django Channels</strong> — для WebSockets (чаты, уведомления).</li>
<li><strong>Celery + Redis/RabbitMQ</strong> — для фоновых задач и периодических заданий.</li>
<li><strong>Docker + docker-compose</strong> — для контейнеризации и локальной разработки.</li>
<li><strong>PostgreSQL</strong> — как основная база данных.</li>
<li><strong>Gunicorn + Nginx</strong> — для продакшен-развёртывания.</li>
<li><strong>GitHub Actions / GitLab CI</strong> — для CI/CD.</li>
<li><strong>Pytest</strong> — для тестирования.</li></ul>
<p>Знание этих инструментов делает разработчика востребованным на рынке.</p>`,
conclusion:`<h3>📌 Выводы по лекции 8</h3><p>Современный Django — это не только веб-фреймворк, но и экосистема для создания API, real-time приложений, асинхронной обработки и микросервисов. Django REST Framework, Channels, Celery и Docker — must-have для профессионального разработчика.</p>`}
];

// ===================== ЗМЕЙКА =====================
let canvas, ctx, snake, dir, food, loop, running, score;
function initGame() {
    canvas = document.getElementById('snakeCanvas');
    if (!canvas) return;
    ctx = canvas.getContext('2d');
    snake = [{x:10,y:10},{x:9,y:10},{x:8,y:10}];
    dir = 'RIGHT';
    food = {x:15,y:10};
    score = 0;
    running = true;
    const scoreEl = document.getElementById('snakeScore');
    if (scoreEl) scoreEl.innerText = 'Очки: 0';
    genFood();
    if (loop) clearInterval(loop);
    loop = setInterval(updateGame, 150);
}
function genFood() {
    let nf;
    do { nf = {x:Math.floor(Math.random()*20), y:Math.floor(Math.random()*20)}; }
    while (snake.some(s => s.x === nf.x && s.y === nf.y));
    food = nf;
}
function updateGame() {
    if (!running) return;
    let head = {...snake[0]};
    if (dir === 'RIGHT') head.x++;
    if (dir === 'LEFT') head.x--;
    if (dir === 'UP') head.y--;
    if (dir === 'DOWN') head.y++;
    if (head.x < 0 || head.x >= 20 || head.y < 0 || head.y >= 20 || snake.some(s => s.x === head.x && s.y === head.y)) {
        running = false;
        clearInterval(loop);
        if (ctx) { ctx.fillStyle='rgba(0,0,0,0.7)'; ctx.fillRect(0,0,400,400); ctx.fillStyle='white'; ctx.font='bold 20px sans-serif'; ctx.fillText('Game Over',140,190); }
        return;
    }
    snake.unshift(head);
    if (head.x === food.x && head.y === food.y) {
        score++;
        const scoreEl = document.getElementById('snakeScore');
        if (scoreEl) scoreEl.innerText = 'Очки: '+score;
        genFood();
    } else { snake.pop(); }
    draw();
}
function draw() {
    if (!ctx) return;
    ctx.fillStyle = '#1a2a32';
    ctx.fillRect(0,0,400,400);
    ctx.fillStyle = '#e67e22';
    ctx.fillRect(food.x*20, food.y*20, 18, 18);
    ctx.fillStyle = '#2ecc71';
    snake.forEach(s => ctx.fillRect(s.x*20, s.y*20, 18, 18));
}
function changeDir(e) {
    if (!running) return;
    const k = e.key;
    if (k === 'ArrowRight' && dir !== 'LEFT') dir = 'RIGHT';
    else if (k === 'ArrowLeft' && dir !== 'RIGHT') dir = 'LEFT';
    else if (k === 'ArrowUp' && dir !== 'DOWN') dir = 'UP';
    else if (k === 'ArrowDown' && dir !== 'UP') dir = 'DOWN';
}
function resetGame() { if (loop) clearInterval(loop); initGame(); }

// ===================== НАВИГАЦИЯ =====================
function escapeHtml(str) { if (!str) return ''; return str.replace(/[&<>]/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[m])); }

function renderHome() {
    const lecItems = lectures.map(l => `<li><a href="#" data-nav="lec" data-id="${l.id}">📘 ${escapeHtml(l.title)}</a></li>`).join('');
    const pracItems = practices.map(p => `<li><a href="#" data-nav="prac" data-id="${p.id}">🛠️ ${escapeHtml(p.title)}</a></li>`).join('');
    return `<div class="dashboard">
        <div class="block"><h2>📖 Лекции (1-8)</h2><ul class="list">${lecItems}</ul><h2 style="margin-top:30px;">✍️ Практики (1-8)</h2><ul class="list">${pracItems}</ul></div>
        <div><div class="game-box"><h3>🐍 Змейка — отдохни</h3><canvas id="snakeCanvas" width="400" height="400"></canvas><div class="score" id="snakeScore">Очки: 0</div><button class="game-btn" id="resetSnakeBtn">🔄 Новая игра</button><p>← ↑ ↓ →</p></div></div>
    </div>`;
}

function getPrevNext(type, id) {
    const items = type === 'lec' ? lectures.map(l => ({type:'lec', id:l.id, title:l.title})) : practices.map(p => ({type:'prac', id:p.id, title:p.title}));
    const idx = items.findIndex(i => i.id === id);
    return { prev: idx > 0 ? items[idx-1] : null, next: idx < items.length-1 ? items[idx+1] : null };
}

function renderNavButtons(type, id) {
    const {prev, next} = getPrevNext(type, id);
    return `<div class="nav-buttons">
        ${prev ? `<div class="nav-btn-page" data-nav="${prev.type}" data-id="${prev.id}">← Предыдущая: ${prev.title}</div>` : '<div class="nav-btn-page" style="opacity:0.3;">← Предыдущая</div>'}
        <div class="nav-btn-page" data-nav="home">🏠 На главную</div>
        ${next ? `<div class="nav-btn-page" data-nav="${next.type}" data-id="${next.id}">Следующая: ${next.title} →</div>` : '<div class="nav-btn-page" style="opacity:0.3;">Следующая →</div>'}
    </div>`;
}

function renderMemeCard(type, id) {
    const meme = type === 'lec' ? lectureMemes[id] : practiceMemes[id];
    if (!meme) return '';
    return `<div class="meme-card"><div class="meme-emoji">${meme.emoji}</div><div class="meme-quote">${meme.quote}</div></div>`;
}

function renderLecture(id) {
    const lec = lectures.find(l => l.id === id);
    if (!lec) return '<div class="page"><p>Лекция не найдена</p></div>';
    const relatedPrac = practices.find(p => p.num === lec.num);
    return `<div class="page"><div class="back" data-nav="home">← ко всем лекциям</div><h1>${escapeHtml(lec.title)}</h1><div class="badge">📘 лекция</div>${renderMemeCard('lec', id)}${lec.infographic}<div class="content">${lec.content}</div><div class="conclusion">${lec.conclusion}</div>${renderNavButtons('lec', id)}${relatedPrac ? `<div style="margin-top:15px;"><div class="nav-btn-page" data-nav="prac" data-id="${relatedPrac.id}">🔗 Перейти к практике: ${relatedPrac.title}</div></div>` : ''}</div>`;
}

function renderPractice(id) {
    const prac = practices.find(p => p.id === id);
    if (!prac) return '<div class="page"><p>Практика не найдена</p></div>';
    const relatedLec = lectures.find(l => l.num === prac.num);
    return `<div class="page"><div class="back" data-nav="home">← ко всем практикам</div><h1>${escapeHtml(prac.title)}</h1><div class="badge">🛠️ практика</div>${renderMemeCard('prac', id)}${prac.infographic}<div class="content">${prac.content}</div><div class="conclusion">${prac.conclusion}</div>${renderNavButtons('prac', id)}${relatedLec ? `<div style="margin-top:15px;"><div class="nav-btn-page" data-nav="lec" data-id="${relatedLec.id}">🔗 Перейти к лекции: ${relatedLec.title}</div></div>` : ''}</div>`;
}

function generateRandomTest() {
    let shuffled = [...fullQuestionBank];
    for (let i = shuffled.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
    }
    return shuffled.slice(0, 30);
}

let currentTestQuestions = generateRandomTest();
let testAnswers = {};
let testSubmitted = false;

function renderTest() {
    let html = `<div class="test-page"><h1>📝 ИТОГОВЫЙ ТЕСТ (30 вопросов)</h1><p>🔘 Закрытые · ✏️ Открытые · ✅ Множественный выбор · 📊 Иерархия · 🔗 Сопоставление</p><p><strong>Вопросы перемешиваются при каждом обновлении страницы!</strong></p>`;
    currentTestQuestions.forEach((q, idx) => {
        const saved = testAnswers[idx];
        html += `<div class="question-card"><div class="q-type">${q.type === 'closed' ? '🔘 Закрытый' : q.type === 'open' ? '✏️ Открытый' : q.type === 'multiple' ? '✅ Множественный выбор' : q.type === 'hierarchy' ? '📊 Установка порядка' : '🔗 Сопоставление'}</div><div class="q-text">${idx + 1}. ${escapeHtml(q.text)}</div><div class="options">`;
        if (q.type === 'closed') {
            q.options.forEach((opt, oi) => { const checked = (saved && saved[0] === oi) ? 'checked' : ''; html += `<div class="option-row"><input type="radio" name="q${idx}" value="${oi}" ${checked} ${testSubmitted ? 'disabled' : ''}> <label>${escapeHtml(opt)}</label></div>`; });
        } else if (q.type === 'open') {
            const val = (saved && typeof saved === 'string') ? saved : ''; html += `<input type="text" id="open_${idx}" value="${escapeHtml(val)}" placeholder="Введите ответ..." ${testSubmitted ? 'disabled' : ''} style="width:100%; max-width:450px;">`;
        } else if (q.type === 'multiple') {
            const selectedArr = saved ? saved : []; q.options.forEach((opt, oi) => { const isChecked = selectedArr.includes(oi); html += `<div class="option-row"><input type="checkbox" name="q${idx}_chk" value="${oi}" ${isChecked ? 'checked' : ''} ${testSubmitted ? 'disabled' : ''}> <label>${escapeHtml(opt)}</label></div>`; });
        } else if (q.type === 'hierarchy') {
            const currentOrder = saved ? saved : [...q.items]; if (!saved && !testSubmitted) testAnswers[idx] = [...q.items]; html += `<div class="hierarchy-select" id="hierarchy_${idx}">`; currentOrder.forEach((item, pos) => { html += `<div class="hierarchy-item"><span style="font-weight:bold;">${pos + 1}.</span> <select data-pos="${pos}" data-idx="${idx}" ${testSubmitted ? 'disabled' : ''}>${q.items.map((it, iopt) => `<option value="${it}" ${currentOrder[pos] === it ? 'selected' : ''}>${escapeHtml(it)}</option>`).join('')}</select></div>`; }); html += `</div>`;
        } else if (q.type === 'match') {
            const currentMatches = saved ? saved : q.pairs.map((_, i) => i); if (!saved && !testSubmitted) testAnswers[idx] = q.pairs.map((_, i) => i); html += `<div id="match_${idx}">`; q.pairs.forEach((pair, pi) => { html += `<div class="match-row"><div class="match-left">📌 ${escapeHtml(pair.left)} →</div><select data-pair="${pi}" data-idx="${idx}" ${testSubmitted ? 'disabled' : ''}>${q.pairs.map((_, optIdx) => `<option value="${optIdx}" ${currentMatches[pi] === optIdx ? 'selected' : ''}>${escapeHtml(q.pairs[optIdx].right)}</option>`).join('')}</select></div>`; }); html += `</div>`;
        }
        html += `</div></div>`;
    });
    html += `<div class="test-actions"><button id="submitTestBtn" class="test-btn">✅ ПРОВЕРИТЬ ОТВЕТЫ</button><button id="reshuffleTestBtn" class="test-btn reset-btn">🔄 НОВЫЙ ТЕСТ</button></div>`;
    if (testSubmitted) {
        let score = 0;
        currentTestQuestions.forEach((q, idx) => {
            const ua = testAnswers[idx];
            if (q.type === 'closed' && ua && ua[0] === q.correct[0]) score++;
            else if (q.type === 'open' && ua && typeof ua === 'string') { if (q.correctKeywords.some(kw => ua.toLowerCase().includes(kw.toLowerCase()))) score++; }
            else if (q.type === 'multiple' && ua && Array.isArray(ua)) { if (ua.length === q.correct.length && ua.every(v => q.correct.includes(v))) score++; }
            else if (q.type === 'hierarchy' && ua && Array.isArray(ua)) { if (JSON.stringify(ua) === JSON.stringify(q.correctOrder)) score++; }
            else if (q.type === 'match' && ua && Array.isArray(ua)) { if (JSON.stringify(ua) === JSON.stringify(q.correct)) score++; }
        });
        const percent = Math.round(score / currentTestQuestions.length * 100);
        html += `<div class="result-area">🎯 <strong>РЕЗУЛЬТАТ: ${score} из ${currentTestQuestions.length} правильных (${percent}%)</strong><br>${score === currentTestQuestions.length ? '✨ ТЫ АБСОЛЮТНЫЙ МАСТЕР DJANGO! ✨' : '📚 Повтори материал и попробуй снова.'}</div>`;
    }
    html += `</div>`;
    return html;
}

function collectTestAnswers() {
    currentTestQuestions.forEach((q, idx) => {
        if (q.type === 'closed') { const sel = document.querySelector(`input[name="q${idx}"]:checked`); testAnswers[idx] = sel ? [parseInt(sel.value)] : null; }
        else if (q.type === 'open') { const inp = document.getElementById(`open_${idx}`); testAnswers[idx] = inp ? inp.value.trim() : ''; }
        else if (q.type === 'multiple') { const chks = document.querySelectorAll(`input[name="q${idx}_chk"]:checked`); testAnswers[idx] = Array.from(chks).map(cb => parseInt(cb.value)); }
        else if (q.type === 'hierarchy') { const cont = document.getElementById(`hierarchy_${idx}`); if (cont) { testAnswers[idx] = Array.from(cont.querySelectorAll('select')).map(sel => sel.value); } }
        else if (q.type === 'match') { const cont = document.getElementById(`match_${idx}`); if (cont) { testAnswers[idx] = Array.from(cont.querySelectorAll('select')).map(sel => parseInt(sel.value)); } }
    });
}

function attachTestHandlers() {
    const submitBtn = document.getElementById('submitTestBtn');
    const reshuffleBtn = document.getElementById('reshuffleTestBtn');
    if (submitBtn) { submitBtn.onclick = () => { collectTestAnswers(); testSubmitted = true; renderContent(); }; }
    if (reshuffleBtn) { reshuffleBtn.onclick = () => { currentTestQuestions = generateRandomTest(); testAnswers = {}; testSubmitted = false; renderContent(); }; }
}

// ===================== ОСНОВНОЙ РЕНДЕРИНГ =====================
function renderContent() {
    const hash = window.location.hash.slice(1);
    const appDiv = document.getElementById('app');
    if (!appDiv) return;
    if (hash === 'test') {
        appDiv.innerHTML = renderTest();
        attachTestHandlers();
    } else if (hash.startsWith('lec')) {
        appDiv.innerHTML = renderLecture(hash);
    } else if (hash.startsWith('prac')) {
        appDiv.innerHTML = renderPractice(hash);
    } else {
        appDiv.innerHTML = renderHome();
        setTimeout(() => {
            initGame();
            const resetBtn = document.getElementById('resetSnakeBtn');
            if (resetBtn) resetBtn.addEventListener('click', resetGame);
            window.addEventListener('keydown', changeDir);
        }, 50);
    }
}

function handleNav(e) {
    const target = e.target.closest('[data-nav]');
    if (!target) return;
    const nav = target.getAttribute('data-nav');
    const id = target.getAttribute('data-id');
    e.preventDefault();
    if (nav === 'home') window.location.hash = 'home';
    else if (nav === 'lec') window.location.hash = id;
    else if (nav === 'prac') window.location.hash = id;
    else if (nav === 'test') window.location.hash = 'test';
}

document.addEventListener('click', function(e) {
    const app = document.getElementById('app');
    if (app && app.contains(e.target)) { handleNav(e); }
});

document.querySelectorAll('.nav-btn').forEach(btn => {
    btn.addEventListener('click', () => {
        const to = btn.getAttribute('data-nav');
        if (to === 'test') window.location.hash = 'test';
        else window.location.hash = 'home';
    });
});

window.addEventListener('hashchange', renderContent);
if (!window.location.hash || window.location.hash === '#') window.location.hash = 'home';
else renderContent();
